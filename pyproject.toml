[project]
name = "playlist-builder"
version = "0.1.0"
description = "Turn a festival lineup poster into tier-weighted Apple Music playlists"
authors = [
    { name = "Randy Ridgley", email = "randy.ridgley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
playlist-builder = "playlist_builder.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
